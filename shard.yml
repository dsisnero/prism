name: prism
version: 0.1.0

authors:
  - Dominic Sisneros <dsisnero@gmail.com>

crystal: '>= 1.22.2'

license: MIT

dependencies:
  # Local development uses sibling checkouts. Swap to the `github:` form once
  # both shards are published; see docs/development.md#dependencies.
  arrow-cr:
    path: ../arrow-cr
  parquet-cr:
    path: ../parquet-cr

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.6
  # Optional: only used by `require "prism/lipgloss"` (styled CLI tables) and by
  # the interactive example. Kept as a development dependency so consumers are
  # not forced to install it. Fetched from GitHub rather than a sibling checkout
  # because `bubbletea` depends on it too, and shards refuses two sources for one
  # shard name; the sibling `../lipgloss` is at the same commit.
  lipgloss:
    github: dsisnero/lipgloss
  # Examples only: the interactive viewer (examples/viewer.cr).
  bubbletea:
    github: dsisnero/bubbletea.cr
  bubbles:
    github: dsisnero/bubbles
